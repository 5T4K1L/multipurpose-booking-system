services:
  postgres:
    # Local PostgreSQL database for development and testing
    image: postgres:17
    container_name: multipurpose-booking-system
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
      POSTGRES_DB: booking_db
    ports:
      # Expose PostgreSQL port to the host machine
      - "5432:5432"
    volumes:
      # Persist PostgreSQL data in a named volume to ensure data is not lost when the container is removed
      - postgres_data:/var/lib/postgresql/data
volumes:
  # Named volume for PostgreSQL data persistence
  postgres_data:
